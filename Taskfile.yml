version: '3'

# GOWORK=off on every go and goreleaser call, inline rather than in `env:`, which
# an exported GOWORK would override. A gitignored go.work (used to link crossmem
# locally) must not make a task build something CI never sees — tasks are the CI
# contract. Link crossmem deliberately instead:
#   GOWORK=<path> go build -tags crossmem ./cmd/huddle
vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  # Same three ldflags GoReleaser injects, so a local build reports a real date
  # instead of "unknown" in `huddle --version`.
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -s -w -X github.com/muthuishere/huddle-next/internal/version.Version={{.VERSION}} -X github.com/muthuishere/huddle-next/internal/version.Commit={{.COMMIT}} -X github.com/muthuishere/huddle-next/internal/version.Date={{.DATE}}

tasks:
  build:
    desc: Build the huddle binary for the current platform
    cmds:
      - GOWORK=off CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/huddle ./cmd/huddle

  test:
    desc: Run Go tests
    cmds:
      - GOWORK=off go test ./...

  lint:
    desc: gofmt check + go vet
    cmds:
      - test -z "$(gofmt -l cmd internal personas room artifacts assets skills)" || (gofmt -l cmd internal personas room artifacts assets skills && exit 1)
      - GOWORK=off go vet ./...

  budget:
    desc: Skill byte budgets (SKILL.md ≤ 6KB, description ≤ 260B, lazy files ≤ 8KB)
    cmds:
      - GOWORK=off go test -run TestSkillByteBudgets ./internal/install/

  ci:
    desc: Run local CI checks
    cmds:
      - task: lint
      - GOWORK=off go test -short ./...
      - task: budget
      - task: build
      - ./bin/huddle --version
      - ./bin/huddle --help

  bench:
    desc: Run benchmarks (huddle start budget, redaction, …)
    cmds:
      - GOWORK=off go test -run '^$' -bench . -benchmem ./...

  install:local:
    desc: Build and install the skills from this checkout
    deps: [build]
    cmds:
      - ./bin/huddle install --skills

  snapshot:
    desc: Build a local multi-platform snapshot
    cmds:
      - GOWORK=off goreleaser release --snapshot --clean --skip=publish

  release:version:
    desc: "Bump every npm package to one version (usage: task release:version VERSION=0.2.0)"
    cmds:
      - scripts/npm-set-version.sh {{.VERSION}}

  release:dry-run:
    desc: Dry-run GoReleaser
    cmds:
      - GOWORK=off goreleaser release --snapshot --clean --skip=publish --verbose
