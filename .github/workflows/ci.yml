name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: go vet ./...
      - run: go test -short ./...
      - name: Skill byte budgets
        run: go test -run TestSkillByteBudgets ./internal/install/
      - run: go build -o bin/huddle${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/huddle
      - run: ./bin/huddle --version
        shell: bash
      - run: ./bin/huddle --help
        shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal assets skills)" || { gofmt -l cmd internal assets skills; exit 1; }
      - name: POSIX sh syntax of npm scripts
        run: bash -n scripts/npm-publish-oidc.sh && bash -n scripts/npm-set-version.sh
      - name: npm versions in lockstep
        run: |
          v=$(node -p "require('./npm/package.json').version")
          for f in npm/platforms/*/package.json; do
            test "$(node -p "require('./$f').version")" = "$v" || { echo "$f version != $v"; exit 1; }
          done
          node -e "const p=require('./npm/package.json');for(const [k,x] of Object.entries(p.optionalDependencies)){if(x!==p.version){console.error(k+' '+x);process.exit(1)}}"

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish
